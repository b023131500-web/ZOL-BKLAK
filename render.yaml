services:
  - type: web
    name: zol-price-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zol-db
          property: connectionString
      - key: ADMIN_TOKEN
        value: XsIMaZlJV0u7L5nTIDUhpIDSPEYlokSuMbWbWogjz0g
      - key: LOG_LEVEL
        value: info
      - key: CRON_HOUR
        value: "3"
      - key: CRON_MINUTE
        value: "0"
      - key: MAKE_WEBHOOK_URL
        value: ""

databases:
  - name: zol-db
    plan: free
    databaseName: zol
    postgresMajorVersion: 16
